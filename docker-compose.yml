# Starts the Scanarr SETUP WIZARD. Paste this into your Docker UI as a Project/Stack (UGREEN: Docker ->
# Project -> Create), or run `docker compose up -d` here. Then open http://<this-machine>:9700
#
# The wizard asks for your folders, login and ports, checks everything, and installs
# Scanarr + qBittorrent + Prowlarr already connected to each other. You can remove the wizard
# afterwards (button on its last page) and start it again any time to change settings, update or uninstall.
#
# It needs the Docker socket to create the containers. Nothing else gets it, except the optional
# updater you can switch on in the wizard.
services:
  setup:
    image: ghcr.io/mohammed-iris/scanarr:latest
    container_name: scanarr-setup
    command: ["setup"]
    user: "0:0"
    ports: ["9700:9700"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
