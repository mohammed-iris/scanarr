# Scanarr + qBittorrent + Prowlarr for the UGREEN DXP2800
#
# Two main folders (Scanarr reads them from qBittorrent's settings):
#   Temp      = unfinished downloads -> SSD volume
#   Completed = finished files       -> HDD volume (Movies/, TV/, Audio/ … are created inside)
# Both containers mount them at the SAME paths, so Scanarr sees exactly what qBit sees.
# Change /volume1 (HDD) and /volume2 (SSD) to match your storage pools.
# Set PUID/PGID to your NAS user's ids (run `id` over SSH).

services:
  scanarr:
    build:
      context: .
      args: { PUID: "1000", PGID: "10" }
    container_name: scanarr
    ports: ["8787:8787"]   # web UI: change the LEFT number to use another port, e.g. "8899:8787"
    environment:
      - TZ=Asia/Dubai
      # optional: fix the login instead of using the generated one
      # - SCANARR_USERNAME=admin
      # - SCANARR_PASSWORD=change-me
    volumes:
      - /volume2/docker/scanarr:/config          # SSD: settings + database, so Scanarr never wakes the HDD by itself
      - /volume2/scanarr/temp:/data/temp
      - /volume1/media:/data/completed
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=10
      - TZ=Asia/Dubai
      - WEBUI_PORT=9090
    ports:
      - "9090:9090"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /volume2/docker/qbittorrent:/config      # SSD
      - /volume2/scanarr/temp:/data/temp
      - /volume1/media:/data/completed
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=10
      - TZ=Asia/Dubai
    ports: ["9696:9696"]
    volumes:
      - /volume2/docker/prowlarr:/config         # SSD
    restart: unless-stopped
