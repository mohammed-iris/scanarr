<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanarr · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230078d4%22/%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%225%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3Cpath d=%22m15 15 4 4%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;place-items:center;background:#1e1e1e;color:#cccccc;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  form{width:340px;background:#252526;border:1px solid #3c3c3c;border-radius:8px;padding:28px 28px 24px;box-shadow:0 10px 40px #0008}
  h1{margin:0 0 4px;font-size:20px;font-weight:600;color:#e7e7e7;display:flex;align-items:center;gap:10px}
  p{margin:0 0 20px;color:#8b8b8b}
  label{display:block;margin:12px 0 4px;color:#8b8b8b;font-size:12px}
  input{width:100%;background:#313131;border:1px solid #3c3c3c;border-radius:3px;color:#cccccc;padding:7px 9px;font:inherit;outline:none}
  input:focus{border-color:#0078d4}
  button{margin-top:20px;width:100%;background:#0078d4;border:0;border-radius:3px;color:#fff;padding:8px;font:inherit;cursor:pointer}
  button:hover{background:#2489db}
  #err{color:#f48771;min-height:18px;margin-top:10px;font-size:12px}
  .hint{margin-top:14px;color:#6b6b6b;font-size:11px}
  code{font-family:ui-monospace,Consolas,monospace;color:#9cdcfe}
</style>
</head>
<body>
<form id="f">
  <h1><svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0078d4"/><circle cx="11" cy="11" r="5" stroke="#fff" stroke-width="2" fill="none"/><path d="m15 15 4 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>Scanarr</h1>
  <p>Sign in to continue</p>
  <label for="u">Username</label><input id="u" autocomplete="username" value="admin" autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <button>Sign in</button>
  <div id="err"></div>
  <div class="hint">Forgot it? Run <code>docker logs scanarr</code> (or check the Scanarr window on Windows). The login is printed at every start.</div>
</form>
<script>
document.getElementById('p').focus();
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username: u.value, password: p.value})});
  if (r.ok) location.href = '/';
  else { const d = await r.json().catch(() => ({})); err.textContent = d.detail || 'Sign in failed'; p.select(); }
};
</script>
</body>
</html>
